{"name":"Build Android APK","on":["push","workflow_dispatch"],"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"unzip -o AndroidBike.zip"},{"uses":"actions/setup-java@v4","with":{"java-version":"17","distribution":"temurin"}},{"run":"yes | \"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager\" --licenses || true"},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.4"}},{"run":"PROJECT_DIR=$(dirname \"$(find . -maxdepth 3 -name 'settings.gradle' | head -n 1)\") && cd \"$PROJECT_DIR\" && gradle assembleDebug && mkdir -p \"$GITHUB_WORKSPACE/out\" && cp app/build/outputs/apk/debug/app-debug.apk \"$GITHUB_WORKSPACE/out/app-debug.apk\""},{"uses":"actions/upload-artifact@v4","with":{"name":"AndroidBike-APK","path":"out/app-debug.apk"}}]}}}
