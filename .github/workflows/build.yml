
{"name":"Build Android APK","on":["push","workflow_dispatch"],"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/setup-java@v4","with":{"java-version":"17","distribution":"temurin"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.4"}},{"run":"python3 -c \"import base64,zlib,json,os; files=json.loads(zlib.decompress(base64.b64decode('"))); [ (os.makedirs(os.path.dirname(k), exist_ok=True) if os.path.dirname(k) else None, open(k,'w',encoding='utf-8').write(v)) for k,v in files.items() ]\" && SDK_DIR=\"${ANDROID_HOME:-/usr/local/lib/android/sdk}\" && echo \"sdk.dir=$SDK_DIR\" > local.properties && mkdir -p \"$SDK_DIR/licenses\" 2>/dev/null || true && printf '\\n24333f8a63b6825ea9c5514f83c2829b004d1fee\\n84831b9409646a918e30573bab4c9c91346d8abd\\nd975f751698a77b662f1254ddbeed3901e976f5a\\n' >> \"$SDK_DIR/licenses/android-sdk-license\" 2>/dev/null || true && SDKMGR=$(find \"$SDK_DIR\" -name sdkmanager 2>/dev/null | head -n 1) && if [ -n \"$SDKMGR\" ]; then yes | \"$SDKMGR\" --sdk_root=\"$SDK_DIR\" --licenses >/dev/null 2>&1 || true; fi && (gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log || { echo '```' >> \"$GITHUB_STEP_SUMMARY\"; tail -n 50 /tmp/gradle.log >> \"$GITHUB_STEP_SUMMARY\"; echo '```' >> \"$GITHUB_STEP_SUMMARY\"; exit 1; })"},{"uses":"actions/upload-artifact@v4","with":{"name":"AndroidBike-APK","path":"app/build/outputs/apk/debug/app-debug.apk"}}]}}
