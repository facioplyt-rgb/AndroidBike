{"name":"Build Android APK","on":["push","workflow_dispatch"],"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"unzip -o '*.zip' || true"},{"uses":"actions/setup-java@v4","with":{"java-version":"17","distribution":"temurin"}},{"uses":"android-actions/setup-android@v3"},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.4"}},{"run":"SETTINGS=$(find . -name 'settings.gradle' | head -n 1) && test -n \"$SETTINGS\" && PROJECT_DIR=$(dirname \"$SETTINGS\") && cd \"$PROJECT_DIR\" && echo \"sdk.dir=$ANDROID_HOME\" > local.properties && yes | sdkmanager --licenses >/dev/null 2>&1 || true && gradle assembleDebug --stacktrace && mkdir -p \"$GITHUB_WORKSPACE/out\" && cp app/build/outputs/apk/debug/app-debug.apk \"$GITHUB_WORKSPACE/out/app-debug.apk\""},{"uses":"actions/upload-artifact@v4","with":{"name":"AndroidBike-APK","path":"out/app-debug.apk"}}]}}}
