{"name":"Build Android APK","on":["push","workflow_dispatch"],"jobs":{"build":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"unzip -o '*.zip' || true"},{"uses":"actions/setup-java@v4","with":{"java-version":"17","distribution":"temurin"}},{"uses":"gradle/actions/setup-gradle@v4","with":{"gradle-version":"8.4"}},{"run":"SETTINGS=$(find . -name 'settings.gradle' | head -n 1) && echo \"Found: $SETTINGS\" && test -n \"$SETTINGS\" && PROJECT_DIR=$(dirname \"$SETTINGS\") && cd \"$PROJECT_DIR\" && SDK_DIR=\"${ANDROID_HOME:-/usr/local/lib/android/sdk}\" && echo \"sdk.dir=$SDK_DIR\" > local.properties && mkdir -p \"$SDK_DIR/licenses\" && printf '\\n24333f8a63b6825ea9c5514f83c2829b004d1fee\\n84831b9409646a918e30573bab4c9c91346d8abd\\nd975f751698a77b662f1254ddbeed3901e976f5a\\n' >> \"$SDK_DIR/licenses/android-sdk-license\" && SDKMGR=$(find \"$SDK_DIR\" -name sdkmanager 2>/dev/null | head -n 1) && if [ -n \"$SDKMGR\" ]; then yes | \"$SDKMGR\" --licenses >/dev/null 2>&1 || true; fi && gradle assembleDebug --no-daemon --stacktrace && mkdir -p \"$GITHUB_WORKSPACE/out\" && cp app/build/outputs/apk/debug/app-debug.apk \"$GITHUB_WORKSPACE/out/app-debug.apk\""},{"uses":"actions/upload-artifact@v4","with":{"name":"AndroidBike-APK","path":"out/app-debug.apk"}}]}}}
